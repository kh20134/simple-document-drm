[project]
name = "simple-document-drm"
version = "1.0.0"
description = "Educational offline document DRM: AES-256-GCM packages opened with a password or a license file."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "최규선" }]
keywords = ["drm", "encryption", "aes-gcm", "education", "document"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Education",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=44"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sdrm = "simple_document_drm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
